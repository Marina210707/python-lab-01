[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findindex"
version = "0.4.0"
description = "Inverted index search engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
findindex = "findindex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/findindex"]

[tool.pyright]
typeCheckingMode = "strict"